name: monitor
on:
  schedule:
    - cron: "30 2,14 * * *"      # twice a day: 08:00 and 20:00 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect, detect changes, classify, report
        id: watch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python -m hawatch
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Save debug pages for any failing source
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: debug-pages, path: debug/, if-no-files-found: ignore}
      - name: Commit state and report
        run: |
          git config user.name "hawatch-bot"
          git config user.email "hawatch-bot@users.noreply.github.com"
          git add state reports
          git diff --cached --quiet || git commit -m "monitor run $(date -u +%Y-%m-%dT%H:%MZ)"
                    git pull --rebase
          git push
      - name: Fail the job if any source is unhealthy (GitHub emails the owner)
        if: steps.watch.outputs.code != '0'
        run: exit 1
